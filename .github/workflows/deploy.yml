name: Deploy to live site

# FastHosts "Hosting for WordPress" only issues temporary 48h SSH credentials
# with a rotating username/password, so automated push-triggered deploys can't
# work. This runs on manual dispatch only.
#
# Two auth modes:
#   * Preferred: store SSH_PRIVATE_KEY + SSH_USER + SSH_HOST secrets (a stable
#     key never expires; only SSH_USER needs updating when it rotates).
#   * Fallback: pass the current temporary username + password as run inputs.
#     The password is registered with ::add-mask:: so it never appears in the
#     job logs. It is still visible in the run's input summary, so regenerate
#     the FastHosts credentials afterwards if that matters to you.
on:
  workflow_dispatch:
    inputs:
      ssh_host:
        description: "SFTP host address"
        required: false
        default: "access-5019091254.webspace-host.com"
      ssh_user:
        description: "Temporary FastHosts SSH username (blank = use SSH_USER secret + key auth)"
        required: false
        default: ""
      ssh_password:
        description: "Temporary FastHosts SSH password (blank = use key auth via SSH_PRIVATE_KEY)"
        required: false
        default: ""
      email_test_to:
        description: "Optional: after deploying, send test emails to this address and print what each route did"
        required: false
        default: ""
      stripe_test:
        description: "Optional Stripe self-test: 'check' = read-only health check; 'full' = check plus a Test-mode purchase with Stripe's test card, then cancel and clean up"
        required: false
        type: choice
        options: ["none", "check", "full"]
        default: "none"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Register password mask
        if: inputs.ssh_password != ''
        env:
          SSHPASS: ${{ inputs.ssh_password }}
        run: echo "::add-mask::$SSHPASS"

      - name: Resolve connection settings
        id: conn
        env:
          IN_HOST: ${{ inputs.ssh_host }}
          IN_USER: ${{ inputs.ssh_user }}
          SEC_HOST: ${{ secrets.SSH_HOST }}
          SEC_USER: ${{ secrets.SSH_USER }}
          USE_PASSWORD: ${{ inputs.ssh_password != '' }}
        run: |
          HOST="${IN_HOST:-$SEC_HOST}"
          USER="${IN_USER:-$SEC_USER}"
          if [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "Missing SSH host or user (provide inputs or set SSH_HOST/SSH_USER secrets)." >&2
            exit 1
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "user=$USER" >> "$GITHUB_OUTPUT"
          echo "use_password=$USE_PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Install SSH key (key-auth mode)
        if: inputs.ssh_password == ''
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/greenbroom
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/greenbroom
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Install sshpass (password mode)
        if: inputs.ssh_password != ''
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy theme
        env:
          SSHPASS: ${{ inputs.ssh_password }}
          HOST: ${{ steps.conn.outputs.host }}
          SSH_LOGIN: ${{ steps.conn.outputs.user }}
        run: |
          if [ "${{ steps.conn.outputs.use_password }}" = "true" ]; then
            sshpass -e rsync -az --delete \
              -e "ssh -p 22 -o StrictHostKeyChecking=no" \
              remote-sync/thegreenbroom/ \
              "$SSH_LOGIN@$HOST:themes/thegreenbroom/"
          else
            rsync -az --delete \
              -e "ssh -i ~/.ssh/greenbroom -p 22" \
              remote-sync/thegreenbroom/ \
              "$SSH_LOGIN@$HOST:themes/thegreenbroom/"
          fi

      - name: Deploy uploads extras (cache rule + image variants)
        env:
          SSHPASS: ${{ inputs.ssh_password }}
          HOST: ${{ steps.conn.outputs.host }}
          SSH_LOGIN: ${{ steps.conn.outputs.user }}
        run: |
          # Additive only. Deliberately NOT rsync --delete: nothing in the media
          # library may ever be removed by a deploy.
          if [ "${{ steps.conn.outputs.use_password }}" = "true" ]; then
            sshpass -e rsync -az \
              -e "ssh -p 22 -o StrictHostKeyChecking=no" \
              deploy-extras/uploads/ \
              "$SSH_LOGIN@$HOST:uploads/"
          else
            rsync -az \
              -e "ssh -i ~/.ssh/greenbroom -p 22" \
              deploy-extras/uploads/ \
              "$SSH_LOGIN@$HOST:uploads/"
          fi

      - name: Deploy plugin
        env:
          SSHPASS: ${{ inputs.ssh_password }}
          HOST: ${{ steps.conn.outputs.host }}
          SSH_LOGIN: ${{ steps.conn.outputs.user }}
        run: |
          if [ "${{ steps.conn.outputs.use_password }}" = "true" ]; then
            sshpass -e rsync -az --delete \
              -e "ssh -p 22 -o StrictHostKeyChecking=no" \
              remote-sync/greenbroom-core/ \
              "$SSH_LOGIN@$HOST:plugins/greenbroom-core/"
          else
            rsync -az --delete \
              -e "ssh -i ~/.ssh/greenbroom -p 22" \
              remote-sync/greenbroom-core/ \
              "$SSH_LOGIN@$HOST:plugins/greenbroom-core/"
          fi

      # Optional email self-test, after everything is deployed.
      #
      # Sends real test emails to email_test_to through the live delivery
      # chain and prints what happened on each route. Locked by these same SSH
      # credentials: a one-time random token is left on the server over SSH and
      # posted to the site, which deletes it on first use and refuses it after
      # ten minutes (see inc/email-selftest.php).
      - name: Email self-test
        if: inputs.email_test_to != ''
        env:
          SSHPASS: ${{ inputs.ssh_password }}
          HOST: ${{ steps.conn.outputs.host }}
          SSH_LOGIN: ${{ steps.conn.outputs.user }}
          TO: ${{ inputs.email_test_to }}
        run: |
          TOKEN="$(openssl rand -hex 24)"
          echo "::add-mask::$TOKEN"
          printf "<?php return array( 'token' => '%s' );\n" "$TOKEN" > .gb-selftest-token.php
          if [ "${{ steps.conn.outputs.use_password }}" = "true" ]; then
            sshpass -e rsync -az -e "ssh -p 22 -o StrictHostKeyChecking=no" \
              .gb-selftest-token.php "$SSH_LOGIN@$HOST:themes/thegreenbroom/.gb-selftest-token.php"
          else
            rsync -az -e "ssh -i ~/.ssh/greenbroom -p 22" \
              .gb-selftest-token.php "$SSH_LOGIN@$HOST:themes/thegreenbroom/.gb-selftest-token.php"
          fi
          rm -f .gb-selftest-token.php
          code=$(curl -sS -o result.json -w '%{http_code}' -X POST \
            --data-urlencode "token=$TOKEN" --data-urlencode "to=$TO" \
            "https://thegreenbroom.uk/?gb_email_selftest=1")
          echo "HTTP $code"
          cat result.json
          echo
          [ "$code" = "200" ]

      # Optional Stripe self-test (see inc/stripe-selftest.php).
      #
      # 'check' reads the Stripe set-up in both modes and lists anything that
      # would stop somebody paying. 'full' then buys the cheapest customer plan
      # in Test mode through the real Stripe Checkout page, with Stripe's test
      # card, in a real browser; waits for Stripe's webhook to switch the
      # membership on; cancels; waits for the webhook to switch it off; and
      # deletes the throwaway account. The site refuses the purchase outright
      # in Live mode. Same one-time-token lock as the email self-test.
      - name: Stripe self-test
        if: inputs.stripe_test == 'check' || inputs.stripe_test == 'full'
        env:
          SSHPASS: ${{ inputs.ssh_password }}
          HOST: ${{ steps.conn.outputs.host }}
          SSH_LOGIN: ${{ steps.conn.outputs.user }}
          USE_PASSWORD: ${{ steps.conn.outputs.use_password }}
          FULL: ${{ inputs.stripe_test == 'full' }}
        run: |
          place_token() {
            TOKEN="$(openssl rand -hex 24)"
            echo "::add-mask::$TOKEN"
            printf "<?php return array( 'token' => '%s' );\n" "$TOKEN" > .gb-stripe-selftest-token.php
            if [ "$USE_PASSWORD" = "true" ]; then
              sshpass -e rsync -az -e "ssh -p 22 -o StrictHostKeyChecking=no" \
                .gb-stripe-selftest-token.php "$SSH_LOGIN@$HOST:themes/thegreenbroom/.gb-stripe-selftest-token.php"
            else
              rsync -az -e "ssh -i ~/.ssh/greenbroom -p 22" \
                .gb-stripe-selftest-token.php "$SSH_LOGIN@$HOST:themes/thegreenbroom/.gb-stripe-selftest-token.php"
            fi
            rm -f .gb-stripe-selftest-token.php
          }
          post() {
            curl -sS -o result.json -w '%{http_code}' -X POST --max-time 170 "$@" \
              "https://thegreenbroom.uk/?gb_stripe_selftest=1"
          }

          echo "=== Health check ==="
          place_token
          code=$(post --data-urlencode "token=$TOKEN" --data-urlencode "phase=check")
          echo "HTTP $code"; cat result.json; echo
          [ "$code" = "200" ] || exit 1

          [ "$FULL" = "true" ] || exit 0

          echo "=== Test purchase: start ==="
          place_token
          code=$(post --data-urlencode "token=$TOKEN" --data-urlencode "phase=start")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then cat result.json; echo; exit 1; fi
          URL=$(jq -r .checkout_url result.json)
          FINISH=$(jq -r .finish_token result.json)
          echo "::add-mask::$FINISH"
          echo "Checkout page created for plan $(jq -r .plan result.json)"

          echo "=== Test purchase: paying with the test card ==="
          npm install --no-save --silent playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          paid=0
          node .github/scripts/stripe-test-checkout.js "$URL" || paid=$?

          # Short check-ins, not one long wait: a request held open on this
          # host blocks Stripe's webhooks behind it (see inc/stripe-selftest.php).
          wait_for() {
            want="$1"; waited=-1
            for i in $(seq 0 5 180); do
              code=$(post --data-urlencode "token=$FINISH" --data-urlencode "phase=status")
              state=$(jq -r .membership result.json 2>/dev/null)
              if [ "$want" = "on" ] && [ "$state" = "active" ]; then waited=$i; break; fi
              if [ "$want" = "off" ] && [ "$state" != "active" ] && [ "$code" = "200" ]; then waited=$i; break; fi
              sleep 5
            done
            echo "$waited"
          }

          echo "=== Test purchase: waiting for Stripe's webhook to switch the membership on ==="
          ON=-1
          [ "$paid" = "0" ] && ON=$(wait_for on)
          echo "switched on after ${ON}s (-1 = not within 3 minutes)"

          if [ "$ON" != "-1" ]; then
            echo "=== Test purchase: subscription, invoice, portal; cancelling in Stripe ==="
            code=$(post --data-urlencode "token=$FINISH" --data-urlencode "phase=verify")
            echo "HTTP $code"; cat result.json; echo
            echo "=== Test purchase: waiting for Stripe's webhook to switch it off ==="
            OFF=$(wait_for off)
            echo "switched off after ${OFF}s (-1 = not within 3 minutes)"
          else
            OFF=-1
          fi

          echo "=== Test purchase: report and clean up ==="
          code=$(post --data-urlencode "token=$FINISH" --data-urlencode "phase=finish" \
            --data-urlencode "activated_after=$ON" --data-urlencode "cancelled_after=$OFF")
          echo "HTTP $code"; cat result.json; echo
          [ "$paid" = "0" ] && [ "$code" = "200" ] && [ "$(jq -r .passed result.json)" = "true" ]

      - name: Keep the checkout screenshot if the test purchase failed
        if: failure() && inputs.stripe_test == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: stripe-checkout
          path: stripe-checkout.png
          if-no-files-found: ignore
