name: Deploy to live site

# NOTE: FastHosts "Hosting for WordPress" only issues temporary 48h SSH creds
# with a rotating username, so automated push-triggered deploys cannot work.
# Deploys are done manually via scripts/push-live.sh. Kept for manual dispatch only.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/greenbroom
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/greenbroom
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy theme
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/greenbroom -p 22" \
            remote-sync/thegreenbroom/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:themes/thegreenbroom/

      - name: Deploy plugin
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/greenbroom -p 22" \
            remote-sync/greenbroom-core/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:plugins/greenbroom-core/
